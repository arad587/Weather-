<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arad Weather Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 16px;
        }
        input::placeholder {
            color: #d1d1d1;
        }
        button {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: #e43f5a;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: left;
            display: none;
        }
        .weather-info p {
            font-size: 16px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌤 Weather App</h2>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city (e.g. Tehran)">
            <button onclick="getWeather()">Search</button>
        </div>

        <div class="card" id="weatherCard">
            <h3 id="cityName" style="text-align: center; margin-top: 0;">--</h3>
            <div class="weather-info">
                <p><span>Condition:</span> <strong id="cond">--</strong></p>
                <p><span>Temperature:</span> <strong id="temp">--</strong></p>
                <p><span>Feels Like:</span> <strong id="feels">--</strong></p>
                <p><span>Humidity:</span> <strong id="humidity">--</strong></p>
                <p><span>Wind Speed:</span> <strong id="wind">--</strong></p>
            </div>
        </div>

        <div class="footer">Created by Arad</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // تمام صفحه شدن مینی اپ در تلگرام

        async function getWeather() {
            let city = document.getElementById('cityInput').value.trim();
            if (!city) return;

            let card = document.getElementById('weatherCard');
            document.getElementById('cityName').innerText = "Fetching...";
            card.style.display = "block";

            try {
                let response = await fetch(`https://wttr.in/${city}?format=j1`);
                let data = await response.json();
                let current = data.current_condition[0];

                document.getElementById('cityName').innerText = city.toUpperCase();
                document.getElementById('cond').innerText = current.weatherDesc[0].value;
                document.getElementById('temp').innerText = current.temp_C + "°C";
                document.getElementById('feels').innerText = current.FeelsLikeC + "°C";
                document.getElementById('humidity').innerText = current.humidity + "%";
                document.getElementById('wind').innerText = current.windspeedKmph + " km/h";
            } catch (err) {
                document.getElementById('cityName').innerText = "Error Loading Data!";
            }
        }
    </script>
</body>
</html>
